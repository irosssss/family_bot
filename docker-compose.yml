# ==========================================
# Family Chores RPG — docker-compose
# Запуск:  docker compose up -d --build
# ==========================================
services:
  postgres:
    image: postgres:18-alpine
    container_name: family_chores_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-family_pass}
      POSTGRES_DB: family_chores
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d family_chores"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: family_chores_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000

      # --- База данных ---
      # Код (src/db/index.ts) читает SQL_* переменные, поэтому
      # передаём их явно. DATABASE_URL добавлен для совместимости.
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:-family_pass}@postgres:5432/family_chores
      SQL_HOST: postgres
      SQL_USER: app_user
      SQL_PASSWORD: ${DB_PASSWORD:-family_pass}
      SQL_DB_NAME: family_chores
      SQL_ADMIN_USER: app_user
      SQL_ADMIN_PASSWORD: ${DB_PASSWORD:-family_pass}

      # --- Telegram ---
      # Код читает BOT_TOKEN (src/bot/telegramBot.ts).
      # Поддержан и алиас TELEGRAM_BOT_TOKEN из .env.
      BOT_TOKEN: ${BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}

      # --- Cron ---
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Europe/Moscow}

      # --- Мониторинг (опционально) ---
      SENTRY_DSN: ${SENTRY_DSN:-}

      # --- S3 (опционально) ---
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    ports:
      - "3000:3000"
    command: sh -c "npm run db:push -- --force && npm start"

volumes:
  pgdata:
